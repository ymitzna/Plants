<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plant Tracker</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#55c99e">
    
    <!-- Explicit Icon Declarations -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Plants</h1>
        <div class="header-actions">
            <button id="export-btn" class="icon-btn icon-btn-small" aria-label="Export Backup" title="Export Backup">💾</button>
            <button id="add-btn" class="icon-btn" aria-label="Add new plant">+</button>
        </div>
    </header>

    <div class="controls-section">
        <input type="text" id="search-input" placeholder="Search by name or species...">
        <div class="filters-row">
            <select id="filter-select">
                <option value="all">All Plants</option>
                <option value="due">Due / Overdue</option>
            </select>
            <select id="sort-select">
                <option value="urgency">Urgency</option>
                <option value="name">Name (A-Z)</option>
            </select>
        </div>
        <button id="water-all-btn" class="btn-primary bulk-water-btn" style="display: none;">Water All Due Today</button>
    </div>

    <main id="plant-list" class="plant-list">
        <!-- Plants will be injected here via JS -->
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toast-message"></span>
        <button id="toast-undo" class="toast-btn" style="display: none;">Undo</button>
    </div>

    <!-- Add Plant Modal -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h2>Add New Plant</h2>
            <form id="add-form">
                <div class="form-group">
                    <label for="plant-photo">Photo</label>
                    <input type="file" id="plant-photo" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="plant-name">Plant Nickname</label>
                    <input type="text" id="plant-name" required placeholder="e.g. Barnaby">
                </div>
                <div class="form-group">
                    <label for="plant-species">Species</label>
                    <input type="text" id="plant-species" required placeholder="e.g. Monstera Deliciosa">
                </div>
                <div class="form-group">
                    <label for="water-interval">Water every (days)</label>
                    <input type="number" id="water-interval" required min="1" placeholder="e.g. 7">
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-add-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Plant Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2>Edit Plant</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-plant-id">
                <div class="form-group photo-preview-group">
                    <img id="edit-photo-preview" src="" alt="Current plant photo" style="display: none;">
                    <label for="edit-plant-photo">Update Photo</label>
                    <input type="file" id="edit-plant-photo" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="edit-plant-name">Plant Nickname</label>
                    <input type="text" id="edit-plant-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-plant-species">Species</label>
                    <input type="text" id="edit-plant-species" required>
                </div>
                <div class="form-group">
                    <label for="edit-water-interval">Water every (days)</label>
                    <input type="number" id="edit-water-interval" required min="1">
                </div>
                <div class="form-group">
                    <label>Watering History</label>
                    <div id="history-container" class="history-container">
                        <!-- History injected here -->
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="delete-btn" class="btn-danger">Delete</button>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
