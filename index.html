<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plant Tracker</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#55c99e">
    
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Plants</h1>
        <div class="header-actions">
            <button id="notify-btn" class="add-btn" style="font-size: 20px;" aria-label="Enable notifications">🔔</button>
            <button id="add-btn" class="add-btn" aria-label="Add new plant">+</button>
        </div>
    </header>

    <div class="controls-section">
        <input type="text" id="search-input" placeholder="Search by name or species...">
        <div class="filters-row">
            <div class="segmented-control" id="filter-control">
                <button type="button" class="segment active" data-val="all">All</button>
                <button type="button" class="segment" data-val="due">Due</button>
            </div>
            <div class="segmented-control" id="sort-control">
                <button type="button" class="segment active" data-val="urgency">Urgency</button>
                <button type="button" class="segment" data-val="name">Name</button>
            </div>
        </div>
        <button id="water-all-btn" class="btn-primary bulk-water-btn" style="display: none;">Water All Due Today</button>
    </div>

    <!-- Pull-to-Refresh Wrapper  -->
    <div id="ptr-wrapper">
        <div id="ptr-indicator">
            <span class="ptr-icon">↻</span>
            <span id="ptr-text">Pull to refresh</span>
        </div>
        <main id="plant-list" class="plant-list">
            <!-- Plants will be injected here via JS -->
        </main>
    </div>

    <div id="toast" class="toast">
        <span id="toast-message"></span>
        <button id="toast-undo" class="toast-btn" style="display: none;">Undo</button>
    </div>

    <!-- Plant Profile Modal (Bottom Sheet) -->
    <div id="profile-modal" class="modal">
        <div class="modal-content profile-content">
            <div class="bottom-sheet-handle profile-handle" style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;"></div>
            <button id="close-profile-btn" class="close-modal-btn">✕</button>
            
            <div id="profile-header-img" class="profile-header-img">
                <span id="profile-placeholder-emoji" style="font-size: 64px; display: none;">🌱</span>
            </div>
            
            <div class="profile-body">
                <h2 id="profile-name">Plant Name</h2>
                <p id="profile-species">Species</p>
                
                <div class="profile-status-container">
                    <div class="profile-status-box">
                        <span id="profile-status-icon">💧</span>
                        <span id="profile-status-text">Status text goes here</span>
                    </div>
                    <div class="profile-status-box" id="profile-fert-box" style="display: none;">
                        <span id="profile-fert-icon">✨</span>
                        <span id="profile-fert-text">Fertilize status</span>
                    </div>
                </div>

                <!-- Growth Photo History Gallery -->
                <div class="form-group" id="profile-gallery-group" style="margin-top: 24px; display: none;">
                    <label>Growth History</label>
                    <div id="profile-gallery-container" class="gallery-container"></div>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>Watering History (Every <span id="profile-interval-text">X</span> days)</label>
                    <div id="profile-history-container" class="history-container"></div>
                </div>

                <div class="form-group" id="profile-fert-history-group" style="display: none; margin-top: 20px;">
                    <label>Feeding History (Summer: <span id="profile-summer-fert-text"></span>w, Winter: <span id="profile-winter-fert-text"></span>w)</label>
                    <div id="profile-fert-history-container" class="history-container"></div>
                </div>

                <div class="modal-actions">
                    <button type="button" id="profile-edit-btn" class="btn-secondary">Edit</button>
                    <button type="button" id="profile-fert-btn" class="btn-fert" style="display: none;">Feed</button>
                    <button type="button" id="profile-water-btn" class="btn-primary">Water</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Plant Modal (Bottom Sheet) -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <div class="bottom-sheet-handle"></div>
            <h2>Add New Plant</h2>
            <form id="add-form">
                <div class="form-group">
                    <label for="plant-photo">First Photo</label>
                    <input type="file" id="plant-photo" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="plant-name">Plant Nickname</label>
                    <input type="text" id="plant-name" required placeholder="e.g. Barnaby">
                </div>
                <div class="form-group">
                    <label for="plant-species">Species</label>
                    <input type="text" id="plant-species" required placeholder="e.g. Monstera Deliciosa">
                </div>
                <div class="form-group">
                    <label for="water-interval">Water every (days)</label>
                    <input type="number" id="water-interval" required min="1" placeholder="e.g. 7">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="plant-summer-fert">Summer feed (weeks)</label>
                        <input type="number" id="plant-summer-fert" min="0" placeholder="e.g. 2 (0 = skip)">
                    </div>
                    <div class="form-group">
                        <label for="plant-winter-fert">Winter feed (weeks)</label>
                        <input type="number" id="plant-winter-fert" min="0" placeholder="e.g. 6 (0 = skip)">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-add-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Plant Modal (Bottom Sheet) -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="bottom-sheet-handle"></div>
            <h2>Edit Plant</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-plant-id">
                
                <div class="form-group photo-edit-group">
                    <label>Manage Photos</label>
                    <div id="edit-photo-gallery" class="edit-photo-gallery"></div>
                    <label for="edit-plant-photo" style="margin-top: 8px;">Add Progress Photo</label>
                    <input type="file" id="edit-plant-photo" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="edit-plant-name">Plant Nickname</label>
                    <input type="text" id="edit-plant-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-plant-species">Species</label>
                    <input type="text" id="edit-plant-species" required>
                </div>
                <div class="form-group">
                    <label for="edit-water-interval">Water every (days)</label>
                    <input type="number" id="edit-water-interval" required min="1">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-summer-fert">Summer feed (weeks)</label>
                        <input type="number" id="edit-summer-fert" min="0">
                    </div>
                    <div class="form-group">
                        <label for="edit-winter-fert">Winter feed (weeks)</label>
                        <input type="number" id="edit-winter-fert" min="0">
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 30px;">
                    <button type="button" id="delete-btn" class="btn-danger" style="width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer;">Delete Plant</button>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-edit-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Updates</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
