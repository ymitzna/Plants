<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Plant Tracker</title>
    
    <!-- PWA Requirements and iOS Native Feel Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f2f2f7">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Plants</h1>
        <button id="add-btn" class="icon-btn">+</button>
    </header>

    <main id="plant-list" class="plant-list">
        <!-- Plants will be injected here via JS -->
    </main>

    <!-- Add Plant Modal -->
    <div id="add-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Add New Plant</h2>
            <form id="add-form">
                <div class="form-group">
                    <label for="plant-name">Plant Name</label>
                    <input type="text" id="plant-name" required placeholder="e.g. Monstera">
                </div>
                <div class="form-group">
                    <label for="water-interval">Water every (days)</label>
                    <input type="number" id="water-interval" required min="1" placeholder="e.g. 7">
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
